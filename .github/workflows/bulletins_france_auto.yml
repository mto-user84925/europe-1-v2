name: Bulletins Météo France & HDF Auto (Paysage 16:9 & TikTok 9:16)

on:
  schedule:
    # Déclenchement automatique chaque matin à 05:00 UTC (07:00 heure de Paris en été, 06:00 en hiver)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      zone:
        description: "Zone(s) à générer"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - france
          - hdf
      mode:
        description: "Mode de rédaction du bulletin"
        required: true
        default: "grand_public"
        type: choice
        options:
          - grand_public
          - btp
          - both
      triggered_by:
        description: "Déclencheur (gregory, patrick, cron)"
        required: false
        default: "gregory"
        type: string

permissions:
  contents: write

jobs:
  build-and-deliver-bulletins:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Récupérer le code du dépôt
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 2. Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 3. Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 4. Installer les dépendances Python & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 5. Générer les cartes météo officielles à J+1 (Paysage & Portrait)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          ZONE_INPUT="${{ github.event.inputs.zone || 'both' }}"
          echo "Génération des cartes pour la zone : $ZONE_INPUT"

          if [ "$ZONE_INPUT" = "both" ] || [ "$ZONE_INPUT" = "france" ]; then
            echo "=== 1/2 Cartes France Paysage 16:9 (J+1 à J+7) ==="
            python generate_meteofrance_maps.py --zone france_pictos --days 8 --start-tomorrow --orientation landscape --patrick

            echo "=== 2/2 Cartes France Portrait 9:16 (J+1 à J+7) ==="
            python generate_meteofrance_maps.py --zone france_pictos --days 8 --start-tomorrow --orientation portrait --patrick
          fi

          if [ "$ZONE_INPUT" = "both" ] || [ "$ZONE_INPUT" = "hdf" ]; then
            echo "=== 1/2 Cartes Hauts-de-France Paysage 16:9 (J+1 à J+7) ==="
            python generate_meteofrance_maps.py --zone hdf --days 8 --start-tomorrow --orientation landscape --patrick

            echo "=== 2/2 Cartes Hauts-de-France Portrait 9:16 (J+1 à J+7) ==="
            python generate_meteofrance_maps.py --zone hdf --days 8 --start-tomorrow --orientation portrait --patrick
          fi

      - name: 6. Compiler les deux formats vidéo avec Voix Off (Paysage 16:9 & TikTok 9:16)
        env:
          PYTHONUNBUFFERED: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'grand_public' }}"
          ZONE_INPUT="${{ github.event.inputs.zone || 'both' }}"
          echo "Lancement de la compilation pour le mode : $MODE et zone : $ZONE_INPUT"
          python generate_daily_bulletins.py --mode "$MODE" --zone "$ZONE_INPUT"

      - name: 7. Sauvegarder les vidéos en Artifacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: bulletins-france-${{ github.run_id }}
          path: output_bulletins/*.mp4
          retention-days: 14

      - name: 8. Publier sur GitHub Releases (Téléchargement direct smartphone & PC)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="bulletins-france-latest"
          # Supprimer l'ancienne release si existante
          gh release delete "$TAG" --yes 2>/dev/null || true

          # Créer la release avec les vidéos .mp4
          gh release create "$TAG" output_bulletins/*.mp4 \
            --title "Bulletins Météo France & HDF (Paysage & TikTok) - $(date '+%d/%m/%Y')" \
            --notes "Bulletins météo officiels France & Hauts-de-France à J+1 (Format Paysage 16:9 broadcast + Format TikTok 9:16 avec voix off Charon). Générés automatiquement le $(date '+%d/%m/%Y à %Hh%M')." \
            --latest

      - name: 9. Envoyer l'e-mail de notification avec liens directs
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SFR_EMAIL: ${{ secrets.SFR_EMAIL }}
          SFR_PASSWORD: ${{ secrets.SFR_PASSWORD }}
          TRIGGERED_BY: ${{ github.event.inputs.triggered_by || 'gregory' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'grand_public' }}"
          TRIG="${{ github.event.inputs.triggered_by || 'gregory' }}"
          ZONE_INPUT="${{ github.event.inputs.zone || 'both' }}"
          python send_bulletins_email.py "$MODE" "$TRIG" "$ZONE_INPUT"
