name: Bulletins TikTok 9:16 Auto (France & HDF)

on:
  schedule:
    # Déclenchement automatique chaque matin à 05:00 UTC (07:00 heure française en été, 06:00 en hiver)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      zone:
        description: "Zone(s) à générer"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - france
          - hdf

permissions:
  contents: write

jobs:
  build-and-deliver-tiktok:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: 2. Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 3. Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 4. Installer les dépendances Python & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt requests
          playwright install chromium

      - name: 5. Générer les cartes météo fraîches (7 jours portrait 9:16)
        env:
          PYTHONUNBUFFERED: "1"
          CHROME_PATH: "/usr/bin/google-chrome"
        run: |
          ZONE_INPUT="${{ github.event.inputs.zone || 'both' }}"
          echo "Génération des cartes pour la zone : $ZONE_INPUT"
          
          if [ "$ZONE_INPUT" = "both" ] || [ "$ZONE_INPUT" = "france" ]; then
            echo "--- Cartes France 9:16 ---"
            python generate_meteofrance_maps.py --zone france_pictos --days 8 --orientation portrait --patrick --temp-highlight
          fi
          
          if [ "$ZONE_INPUT" = "both" ] || [ "$ZONE_INPUT" = "hdf" ]; then
            echo "--- Cartes Hauts-de-France 9:16 ---"
            python generate_meteofrance_maps.py --zone hdf --days 8 --orientation portrait --patrick --temp-highlight
          fi

      - name: 6. Compiler les bulletins TikTok (Données Météo officielles + Voix Charon + 100% Cartes)
        env:
          PYTHONUNBUFFERED: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ZONE_INPUT="${{ github.event.inputs.zone || 'both' }}"
          python generate_tiktok_bulletins.py --zone "$ZONE_INPUT"

      - name: 7. Sauvegarder les vidéos en Artifacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: bulletins-tiktok-${{ github.run_id }}
          path: output_tiktok/*.mp4
          retention-days: 14

      - name: 8. Publier la dernière version sur GitHub Releases (Téléchargement direct smartphone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="tiktok-bulletins-latest"
          # Supprimer l'ancienne release si elle existe
          gh release delete "$TAG" --yes 2>/dev/null || true
          
          # Créer la release avec les fichiers .mp4 du jour
          gh release create "$TAG" output_tiktok/*.mp4 \
            --title "Bulletins TikTok France & HDF - $(date '+%d/%m/%Y')" \
            --notes "Bulletins météo 9:16 pour TikTok (100% cartes fixes, analyse Vision des pictos, voix continue Charon). Générés automatiquement le $(date '+%d/%m/%Y à %Hh%M')." \
            --latest
