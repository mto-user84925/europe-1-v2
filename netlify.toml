# Netlify Configuration — proxy aligné sur vercel.json
# ⚠️ La plateforme de production est Vercel (voir vercel.json).
# Ce fichier est conservé pour un déploiement Netlify de secours et doit rester
# SYNCHRONE avec vercel.json, sinon des écrans se cassent silencieusement.

[[redirects]]
  from = "/api-meteo/*"
  to = "https://public-api.meteofrance.fr/public/DPObs/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-meteo-paquet/*"
  to = "https://public-api.meteofrance.fr/public/DPPaquetObs/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-meteo-poste/*"
  to = "https://public-api.meteofrance.fr/public/DPAI01/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-meteo-clim/*"
  to = "https://public-api.meteofrance.fr/public/DPClim/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-radar-mf/*"
  to = "https://public-api.meteofrance.fr/public/DPPaquetRadar/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-meteociel/*"
  to = "https://www.meteociel.fr/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-agate/*"
  to = "https://www.mwattest.fr/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ORAGE/*"
  to = "https://www.mwattest.fr/ORAGE/:splat"
  status = 200
  force = true

# SPA fallback — doit rester en dernier
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
